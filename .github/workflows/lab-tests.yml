name: lab-tests

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev, master]

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      - name: Rust toolchain (nightly-2026-05-24, mesmo do build local)
        uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-05-24
          components: rust-src, llvm-tools, clippy, rustfmt

      - name: Suite de testes WiFi/BT/I2C
        working-directory: recipes/core/base/source
        run: |
          set -e
          for pkg in iwlwifi rtw88 mt7921d ath9k net80211 btusd \
                     iwlwifi_net i2c-hid i2c-dwd driver-block nvmed \
                     wpa_supplicant i2c-hidd; do
            echo "=== $pkg ==="
            cargo test -p "$pkg"
          done

      - name: Resumo
        run: echo "suite completa de drivers rodada"
