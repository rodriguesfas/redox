name: lab-tests

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev, master]

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout fork (dev)
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      - name: Rust nightly do build local
        uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-05-24
          components: rust-src, llvm-tools, clippy, rustfmt

      # O inputd depende do orbclient, que no host linka contra SDL2.
      - name: libSDL2 para o orbclient
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libsdl2-dev

      # O workspace recipes/core/base/source ee parcial no fork: adicionamos apenas drivers/Cargo.toml/
      # Makefile/net. Os outros membros moram em base.git -- cloneiamos duro e o nosso por cima (sem
      # --delete preserva nossas pastas); os arquivos AIOS que o base.git nao tem ficam rastreados aqui
      # (crate bcmgenetd, examples/rowtest.rs, unit do genetd).
      - name: Popula source/ com base.git (rsync overlay garante nossos arquivos)
        run: |
          set -e
          # 19/10/2026: o gitlab.redox-os.org esta devolvendo 500 no Gitaly (clone e archive); em
          # outros dias o ls-refs do protocol v2 tambem falha. Tenta git (protocol v1), depois o
          # archive, e desiste depois de 3 rodadas.
          rm -rf /tmp/base-src /tmp/base-src.tar.gz
          ok=
          for attempt in 1 2 3; do
            if git -c protocol.version=1 clone --depth 1 https://gitlab.redox-os.org/redox-os/base.git /tmp/base-src; then
              ok=1
              break
            fi
            echo "clone falhou (tentativa $attempt)"
            rm -rf /tmp/base-src
            if curl -fsSL -o /tmp/base-src.tar.gz https://gitlab.redox-os.org/redox-os/base/-/archive/main/base-main.tar.gz; then
              mkdir -p /tmp/base-src
              tar -xzf /tmp/base-src.tar.gz -C /tmp/base-src --strip-components=1
              ok=1
              break
            fi
            echo "archive falhou (tentativa $attempt); retry em 15s"
            rm -rf /tmp/base-src /tmp/base-src.tar.gz
            sleep 15
          done
          test -n "$ok"
          # --ignore-existing: preenche so o que falta; NAO sobrescreve nossos drivers
          rsync -a --ignore-existing /tmp/base-src/ recipes/core/base/source/
          ls recipes/core/base/source/audiod/Cargo.toml
          test -d recipes/core/base/source/drivers/net/bcmgenetd
          grep -c ath9k_net recipes/core/base/source/Cargo.toml

      - name: Suite de testes (drivers WiFi/BT/i2c/storage/audio + journald/logind/networkd/resolved/dhcpd/inputd)
        working-directory: recipes/core/base/source
        run: |
          set -e
          PKGS="iwlwifi rtw88 mt7921d ath9k net80211 btusd iwlwifi_net i2c-hid i2c-dwd driver-block nvmed wpa_supplicant i2c-hidd acpid journald logind networkd resolved dhcpd inputd"
          for pkg in $PKGS; do
            echo "=== $pkg ==="
            cargo test -p "$pkg"
          done

      - name: Resumo
        run: echo "suite completa rodada"
