[source]
git = "https://gitlab.redox-os.org/redox-os/kernel.git"
# AIOS: rev local (aviso de syscall antigo limitado a 8 por boot). O commit
# também está em https://github.com/aios-b-612/kernel (branch
# aios-quiet-old-abi) caso o checkout local em source/ não esteja disponível.
rev = "d4b646ce2ae14b389ec2122089370bab1a08f378"

[build]
template = "custom"
script = """
cd "${COOKBOOK_SOURCE}"
make install BUILD="${COOKBOOK_BUILD}" DESTDIR="${COOKBOOK_STAGE}"
"""
