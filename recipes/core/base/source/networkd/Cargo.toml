[package]
name = "networkd"
description = "Network management (networkd/networkctl) for Redox"
version = "0.1.0"
edition = "2021"

[lib]
name = "networkd"
path = "src/lib.rs"

[[bin]]
name = "networkd"
path = "src/bin/networkd.rs"

[[bin]]
name = "networkctl"
path = "src/bin/networkctl.rs"

# The daemon serves the state at `/scheme/networkd`; the host build is only
# there to test the logic, so the Redox half is compiled where it runs.
[target.'cfg(target_os = "redox")'.dependencies]
daemon = { path = "../daemon" }
libredox.workspace = true
redox-scheme.workspace = true
redox_syscall.workspace = true
scheme-utils = { path = "../scheme-utils" }

[lints]
workspace = true
