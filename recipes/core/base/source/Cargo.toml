[workspace]
resolver = "2"
members = [
    "audiod",
    "config",
    "daemon",
    "dhcpd",
    "getty",
    "init",
    "initfs",
    "initfs/tools",
    "ipcd",
    "logd",
    "netstack",
    "ptyd",
    "ramfs",
    "randd",
    "scheme-utils",
    "zerod",

    "drivers/common",
    "drivers/executor",

    "drivers/acpid",
    "drivers/hwd",
    "drivers/pcid",
    "drivers/pcid-spawner",
    "drivers/rtcd",
    "drivers/vboxd",
    "drivers/inputd",
    "drivers/virtio-core",

    "drivers/audio/ac97d",
    "drivers/audio/ihdad",
    "drivers/audio/sb16d",

    "drivers/graphics/console-draw",
    "drivers/graphics/drawbench",
    "drivers/graphics/fbbootlogd",
    "drivers/graphics/driver-graphics",
    "drivers/graphics/fbcond",
    "drivers/graphics/graphics-ipc",
    "drivers/graphics/ihdgd",
    "drivers/graphics/vesad",
    "drivers/graphics/virtio-gpud",

    "drivers/input/ps2d",
    "drivers/input/usbhidd",

    "drivers/net/driver-network",
    "drivers/net/e1000d",
    "drivers/net/ixgbed",
    "drivers/net/rtl8139d",
    "drivers/net/rtl8168d",
    "drivers/net/ath9k",
    "drivers/net/ath9k_net",
    "net/wpa_supplicant",
    "drivers/net/iwlwifi",
    "drivers/net/iwlwifi_net",
    "drivers/net/rtw88",
    "drivers/net/rtw88_net",
    "drivers/net/mt7921d",
    "drivers/net/mt7921d_net",
    "drivers/net/virtio-netd",
    "drivers/net/net80211",

    "drivers/redoxerd",

    "drivers/storage/ahcid",
    "drivers/storage/bcm2835-sdhcid",
    "drivers/storage/driver-block",
    "drivers/storage/ided",
    "drivers/storage/lived",          # TODO: not really a driver...
    "drivers/storage/nbdd",
    "drivers/storage/nvmed",
    "drivers/storage/usbscsid",
    "drivers/storage/virtio-blkd",

    "drivers/usb/xhcid",
    "drivers/usb/usbctl",
    "drivers/usb/usbhubd",
    "drivers/usb/btusd",
    "drivers/i2c/dwd",
    "drivers/input/i2c_hid",
]

# Bootstrap needs it's own profile configuration
exclude = ["bootstrap"]

# Low-level Redox OS crates should be kept in sync using workspace dependencies
# Remember to also update bootstrap dependencies, those are not in the workspace
[workspace.dependencies]
acpi =  { git = "https://gitlab.redox-os.org/redox-os/acpi.git", branch = "redox-6.x" }
anyhow = "1"
bitflags = "2"
clap = "4"
drm = "0.15.0"
drm-ffi = "0.9.1"
drm-fourcc = "2.2.0"
drm-sys = "0.8.1"
edid = "0.3.0" #TODO: edid is abandoned, fork it and maintain?
fdt = "0.1.5"
libc = "0.2.181"
log = "0.4"
libredox = "0.1.25"
orbclient = "0.4.1"
psf-rs = "2.2.0"
parking_lot = "0.12"
pico-args = "0.5"
plain = "0.2.3"
redox_event = "0.4.8"
redox-scheme = "0.11"
redox-ioctl = { git = "https://gitlab.redox-os.org/redox-os/relibc.git" }
redox-log = { git = "https://gitlab.redox-os.org/redox-os/redox-log.git" }
redox_syscall = { version = "0.9.4",  features = ["std"] }
redox-rings = { git = "https://gitlab.redox-os.org/redox-os/redox-rings.git", features = ["userspace", "sync"] }
redox_termios = "0.1.4"
ron = "0.8.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
slab = "0.4.9"
smallvec = "1"
spin = "0.10"
static_assertions = "1.1.0"
thiserror = "2"
toml = "1"
getrandom = { version = "=0.2", default-features = false, features = ["custom"] }

[workspace.lints.rust]
missing_docs = "allow" #TODO: set to deny when all public functions are documented

[workspace.lints.clippy]
missing_safety_doc = "warn" #TODO: set to deny when all safety documentation is completed
precedence = "deny"
unused_io_amount = "warn" #TODO: have an abstraction to irq file read/write, then set to deny
perf = { level = "deny", priority = -1 }

[patch.crates-io]
getrandom = { git = "https://github.com/rust-random/getrandom", rev = "v0.2.17" }

[patch."https://gitlab.redox-os.org/redox-os/relibc.git"]
#redox-ioctl = { path = "../../relibc/source/redox-ioctl" }
