[package]
name = "aios-security"
version = "0.1.0"
edition = "2021"
description = "AIOS Security - AI model isolation and permissions using Redox contain scheme"
license = "MIT"

[dependencies]
aios-core = { path = "../ai-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
uuid = { version = "1.0", features = ["v4", "serde"] }
dirs = "5.0"
thiserror = "1.0"
anyhow = "1.0"
clap = { version = "4.0", features = ["derive"] }